[general]
live_config_reload = true

[window]
dimensions = { columns = 80, lines = 25 }
opacity = 0.8
dynamic_title = false

[scrolling]
history = 12345

[selection]
save_to_clipboard = true

[terminal]
{{- if eq .chezmoi.os "windows" }}
shell = { program = "pwsh", args = ['-nologo'] }
{{- else if eq .chezmoi.os "linux" }}
shell = { program = "bash", args = [] }
{{- end }}

[mouse]
bindings = [
    { mouse = "Right", mods = "None", action = "Paste" }
]

[keyboard]
bindings = [
    { key = "m", mods = "Alt", action = "ToggleMaximized" },
    { key = "b", mods = "Control|Shift", action = "Minimize" },
    { key = "w", mods = "Alt", action = "Quit" },
]

[[hints.enabled]]
command = "xdg-open" # On Linux/BSD
# command = "open" # On macOS
# command = { program = "cmd", args = [ "/c", "start", "" ] } # On Windows
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "e", mods = "Alt" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"
