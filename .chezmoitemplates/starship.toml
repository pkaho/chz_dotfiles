{{- /* ── 配置变量和模式切换 ──────────────────────────────────────────── */ -}}
{{- $config := dict -}}

{{- /* 基础配置（默认模式） */ -}}
{{- $_ := set $config "semicircle_left" "" -}}
{{- $_ := set $config "semicircle_right" "" -}}
{{- $_ := set $config "triangle" "" -}}
{{- $_ := set $config "disabled_os_user" true -}}
{{- $_ := set $config "disabled_time" true -}}

{{- /* 格式化字符串模板 */ -}}
{{- $_ := set $config "format_dir" `'[$path]($style)[$read_only]($read_only_style)'` -}}
{{- $_ := set $config "format_git_branch" `' on [$symbol $branch]($style)'` -}}
{{- $_ := set $config "format_git_status" `'([ $all_status($ahead_behind)]($style))'` -}}
{{- $_ := set $config "format_git_state" `'([  $state( $progress_current/$progress_total) ]($style))'` -}}
{{- $_ := set $config "format_git_commit" `'([   $hash( $tag)]($style))'` -}}
{{- $_ := set $config "format_lang" `" is [$symbol $version]($style)"` -}}
{{- $_ := set $config "format_kubernetes" `' via [$symbol $context:$namespace]($style)'` -}}
{{- $_ := set $config "format_docker" `' via [$symbol( $context)]($style)'` -}}
{{- $_ := set $config "format_conda" `' via [$symbol( $environment)]($style)'` -}}
{{- $_ := set $config "format_pixi" `' via [$symbol $version]($style)'` -}}
{{- $_ := set $config "format_duration" `' took [$duration]($style)'` -}}

{{- /* Rainbow模式覆盖 */ -}}
{{- if eq .mode "rainbow" -}}
{{- $_ := set $config "semicircle_left" "" -}}
{{- $_ := set $config "semicircle_right" "" -}}
{{- $_ := set $config "triangle" " " -}}
{{- $_ := set $config "disabled_os_user" false -}}
{{- $_ := set $config "disabled_time" false -}}
{{- $_ := set $config "format_dir" `'[$path ]($style)[$read_only]($read_only_style)'` -}}
{{- $_ := set $config "format_git_branch" `'[$symbol $branch ]($style)'` -}}
{{- $_ := set $config "format_git_status" `'([$all_status($ahead_behind) ]($style))'` -}}
{{- $_ := set $config "format_git_state" `'[ $state( $progress_current/$progress_total) ]($style)'` -}}
{{- $_ := set $config "format_git_commit" `'[  $hash ($tag )]($style)'` -}}
{{- $_ := set $config "format_lang" `"[$symbol $version ]($style)"` -}}
{{- $_ := set $config "format_kubernetes" `'[$symbol $context:$namespace ]($style)'` -}}
{{- $_ := set $config "format_docker" `'[$symbol( $context) ]($style)'` -}}
{{- $_ := set $config "format_conda" `'[$symbol( $environment) ]($style)'` -}}
{{- $_ := set $config "format_pixi" `'[$symbol $version ]($style)'` -}}
{{- $_ := set $config "format_duration" `'[  $duration]($style)'` -}}
{{- end -}}

{{- /* ── 主提示符格式 ───────────────────────────────────────────────── */ -}}
"$schema" = 'https://starship.rs/config-schema.json'

palette = '{{ .palette }}'

format = """
[{{ $config.semicircle_left }}](color_bg_os)\
$os\
$username\
${env_var.__ShellDepthIcon}\

[{{ $config.triangle }}](fg:color_bg_os bg:color_bg_path)\
$directory\
[{{ $config.triangle }}](fg:color_bg_path bg:color_bg_git)\
$git_branch\
$git_status\
$git_state\
$git_commit\

[{{ $config.triangle }}](fg:color_bg_git bg:color_bg_lang)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\

[{{ $config.triangle }}](fg:color_bg_lang bg:color_bg_env)\
$conda\
$docker_context\
$kubernetes\
$pixi\

[{{ $config.triangle }}](fg:color_bg_env bg:color_bg_time)\
$time\
$cmd_duration\

[{{ $config.semicircle_right }}](color_bg_time)\
$line_break\
$character"""

# ── 操作系统模块 ──────────────────────────────────────────────────────

[os]
disabled = {{ $config.disabled_os_user | toString }}
style = 'bg:color_bg_os fg:color_fg_os'
format = '[$symbol ]($style)'

[os.symbols]
Windows          = '󰍲'
Ubuntu           = '󰕈'
SUSE             = ''
Raspbian         = '󰐿'
Mint             = '󰣭'
Macos            = '󰀵'
Manjaro          = ''
Linux            = '󰌽'
Gentoo           = '󰣨'
Fedora           = '󰣛'
Alpine           = ''
Amazon           = ''
Android          = ''
AOSC             = ''
Arch             = '󰣇'
Artix            = '󰣇'
EndeavourOS      = ''
CentOS           = ''
Debian           = '󰣚'
Redhat           = '󱄛'
RedHatEnterprise = '󱄛'
Pop              = ''
Zorin            = ''

[username]
disabled = {{ $config.disabled_os_user | toString }}
show_always = true
style_user  = 'bg:color_bg_os fg:color_fg_os'
style_root  = 'bg:color_bg_os fg:color_fg_os'
format      = '[$user ]($style)'

[env_var.__ShellDepthIcon]
disabled    = false
variable    = "__ShellDepthIcon"
style       = 'bg:color_bg_os fg:color_fg_os'
format      = "([$env_value ]($style))"

# ── 目录模块 ──────────────────────────────────────────────────────────

[directory]
truncation_length = 3
truncation_symbol = '…/'
read_only         = '󰌾 '
style             = 'bg:color_bg_path fg:color_fg_path'
read_only_style   = 'bg:color_bg_path fg:color_bg_env'
format            = {{ $config.format_dir }}

# ── Git模块 ───────────────────────────────────────────────────────────

[git_branch]
disabled = false
symbol   = ''
style    = 'bg:color_bg_git fg:color_fg_git'
format   = {{ $config.format_git_branch }}

[git_status]
disabled = false
conflicted  = ' '
stashed     = ' '
deleted     = ' '
renamed     = ' 󰑕'
modified    = ' '
typechanged = ' 󰕁'
staged      = ' $count:'
untracked   = ' $count:'
diverged    = '  $ahead_count $behind_count'
ahead       = ' $count:'
behind      = ' $count:'
up_to_date  = ' '
style    = 'bg:color_bg_git fg:color_fg_git'
format   = {{ $config.format_git_status }}

[git_state]
disabled = false
merge       = ''
bisect      = ''
rebase      = ''
revert      = '󰕌'
cherry_pick = ''
am          = ''
am_or_rebase = ' or  '
style    = 'bg:color_bg_git fg:color_fg_git'
format   = {{ $config.format_git_state }}

[git_commit]
disabled           = false
only_detached      = false
tag_disabled       = false
commit_hash_length = 5
tag_symbol         = ' '
style              = 'bg:color_bg_git fg:color_fg_git'
format             = {{ $config.format_git_commit }}

# ── 语言模块 ──────────────────────────────────────────────────────────
{{/* 定义语言符号 */}}
{{
$lang_symbols := dict
    "nodejs"   ""
    "c"        ""
    "cpp"      ""
    "rust"     ""
    "golang"   ""
    "php"      ""
    "java"     ""
    "kotlin"   ""
    "haskell"  ""
    "python"   ""
}}

{{- range $lang, $symbol := $lang_symbols -}}
[{{ $lang }}]
symbol = '{{ $symbol }}'
style  = 'bg:color_bg_lang fg:color_fg_lang'
format = {{ $config.format_lang }}
{{- if eq $lang "python" }}
python_binary = [['uv', 'run', '--no-python-downloads', 'python'], 'python', 'python3', '.pixi/envs/default/bin/python']
{{- end }}

{{ end -}}

# ── 环境模块 ──────────────────────────────────────────────────────────

[kubernetes]
disabled         = false
symbol           = '󱃾'
detect_env_vars  = ['KUBECONFIG']
detect_files     = ['k8s', '.k8s', '.kube']
style            = 'bg:color_bg_env fg:color_fg_env'
format           = {{ $config.format_kubernetes }}

[docker_context]
disabled = false
symbol   = ''
style    = 'bg:color_bg_env fg:color_fg_env'
format   = {{ $config.format_docker }}

[conda]
disabled    = false
symbol      = '🅒'
ignore_base = false
style       = 'bg:color_bg_env fg:color_fg_env'
format      = {{ $config.format_conda }}

[pixi]
disabled = false
symbol   = '󰇾'
style    = 'bg:color_bg_env fg:color_fg_env'
format   = {{ $config.format_pixi }}

# ── 时间模块 ──────────────────────────────────────────────────────────

[time]
disabled    = {{ $config.disabled_time | toString }}
time_format = '%R'
style       = 'fg:color_fg_time bg:color_bg_time'
format      = '[ $time]($style)'

[cmd_duration]
disabled          = false
min_time          = 500
show_milliseconds = true
style             = 'fg:color_fg_time bg:color_bg_time'
format            = {{ $config.format_duration }}

# ── 提示符字符模块 ────────────────────────────────────────────────────

[line_break]
disabled = false

{{- if eq .mode "rainbow" }}
[character]
success_symbol = '[❯](fg:bold green)[❯](fg:bold orange)[❯](fg:bold red)'
error_symbol   = '[❯](fg:bold red)[❯](fg:bold red)[❯](fg:bold red)'
vimcmd_symbol             = '[❮](fg:bold green)[❮](fg:bold orange)[❮](fg:bold red)'
vimcmd_replace_one_symbol = '[❮](fg:bold yellow)[❮](fg:bold yellow)[❮](fg:bold yellow)'
vimcmd_replace_symbol     = '[❮](fg:bold yellow)[❮](fg:bold yellow)[❮](fg:bold yellow)'
vimcmd_visual_symbol      = '[❮](fg:bold cyan)[❮](fg:bold cyan)[❮](fg:bold cyan)'
{{- else if eq .mode "pure" }}
[character]
success_symbol            = '[➜](bold green)'
error_symbol              = '[✗](bold red)'
vimcmd_symbol             = '[V](bold green)'
vimcmd_replace_one_symbol = '[V](bold purple)'
vimcmd_replace_symbol     = '[V](bold purple)'
vimcmd_visual_symbol      = '[V](bold yellow)'
{{- end }}

# ── 调色板定义 ────────────────────────────────────────────────────────

