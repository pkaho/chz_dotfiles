"$schema" = 'https://starship.rs/config-schema.json'

palette = "color_collage"

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$git_commit\
$git_state\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$conda\
$docker_context\
$kubernetes\
$pixi\
$time\
$cmd_duration\
$line_break\
$character"""

# ╭──────────────────────────────────────────────────────────╮
# │ 系统层                                                   │
# ╰──────────────────────────────────────────────────────────╯
[os]
disabled = true
style = 'color_fg_os'
format = '[$symbol ]($style)'

[os.symbols]
Windows = '󰍲'
Ubuntu = '󰕈'
SUSE = ''
Raspbian = '󰐿'
Mint = '󰣭'
Macos = '󰀵'
Manjaro = ''
Linux = '󰌽'
Gentoo = '󰣨'
Fedora = '󰣛'
Alpine = ''
Amazon = ''
Android = ''
AOSC = ''
Arch = '󰣇'
Artix = '󰣇'
EndeavourOS = ''
CentOS = ''
Debian = '󰣚'
Redhat = '󱄛'
RedHatEnterprise = '󱄛'
Pop = ''
Zorin = ''

[username]
show_always = true
style_user = 'color_fg_os'
style_root = 'color_fg_os'
format = '[$user ]($style)'

# ╭──────────────────────────────────────────────────────────╮
# │ 目录层                                                   │
# ╰──────────────────────────────────────────────────────────╯
[directory]
style = 'color_fg_path'
read_only_style = 'color_fg_path'
read_only = '󰌾 '
format = 'in[ $path ]($style)[$read_only]($read_only_style)'
truncation_length = 3
truncation_symbol = '…/'

# ╭──────────────────────────────────────────────────────────╮
# │ 版本控制层                                               │
# ╰──────────────────────────────────────────────────────────╯
[git_branch]
disabled = false
symbol = ''
style = 'color_fg_git'
format = 'on[ $symbol $branch ]($style)'

[git_status]
disabled = false
style = 'color_fg_git'
format = '[$all_status$ahead_behind ]($style)'
conflicted  = ' ' # 正在合并/变基, 出现冲突未解决
stashed     = ' ' # 本地有 git stash 存起来的条目
deleted     = ' ' # 跟踪的文件被删除未 commit
renamed     = ' 󰑕' # 跟踪的文件重命名未 commit
modified    = ' ' # 跟踪的文件内容改动未 commit
typechanged = ' 󰕁' # 文件类型改变(e.g. 普通 -> 可执行)
staged      = ' $count:' # 改动已 git add 进暂存区
untracked   = ' $count:' # 新建文件未跟踪
diverged    = '  $ahead_count $behind_count' # 本地既领先又落后(分叉)
ahead       = ' $count:' # 触发条件: commit 但没 push
behind      = ' $count:' # 触发条件: 远程仓库有更新且本地尚未合并
up_to_date  = ' '        # 触发条件: ahead 和 behind 无触发时

[git_commit]
disabled = false
style = 'color_fg_git'
format = '[  $hash $tag]($style)'
commit_hash_length = 5
tag_symbol = ' '
only_detached = false
tag_disabled = false

[git_state]
disabled = false
style = 'color_fg_git'
format = '[ $state$progress_current/$progress_total ]($style)'
merge = ''  # 无步进信息
bisect = '' # 无步进信息
rebase       = ' '
revert       = '󰕌 '
cherry_pick  = ' '
am           = ' '
am_or_rebase = ' or  '

# ╭──────────────────────────────────────────────────────────╮
# │ 语言层                                                   │
# ╰──────────────────────────────────────────────────────────╯
[nodejs]
symbol = ''
style = 'color_fg_lang'
format = 'is[ $symbol $version ]($style)'

[c]
symbol = ' '
style = 'color_fg_lang'
format = 'is[ $symbol $version ]($style)'

[cpp]
symbol = ' '
style = 'color_fg_lang'
format = 'is[ $symbol $version ]($style)'

[rust]
symbol = ''
style = 'color_fg_lang'
format = 'is[ $symbol $version ]($style)'

[golang]
symbol = ''
style = 'color_fg_lang'
format = 'is[ $symbol $version ]($style)'

[php]
symbol = ''
style = 'color_fg_lang'
format = 'is[ $symbol $version ]($style)'

[java]
symbol = ''
style = 'color_fg_lang'
format = 'is[ $symbol $version ]($style)'

[kotlin]
symbol = ''
style = 'color_fg_lang'
format = 'is[ $symbol $version ]($style)'

[haskell]
symbol = ''
style = 'color_fg_lang'
format = 'is[ $symbol $version ]($style)'

[python]
symbol = ''
style = 'color_fg_lang'
python_binary = [['uv', 'run', '--no-python-downloads', 'python'], 'python', 'python3', 'python3', '.pixi/envs/default/bin/python']
format = 'is[ $symbol $version ]($style)'

# ╭──────────────────────────────────────────────────────────╮
# │ 环境/容器层                                              │
# ╰──────────────────────────────────────────────────────────╯
[kubernetes]
disabled = false
detect_env_vars = ['KUBECONFIG']
detect_files = ['k8s', '.k8s', '.kube']
symbol = '☸ '
style = 'color_fg_env'
format = 'via[ $symbol $context:$namespace ]($style)'

[docker_context]
disabled = false
symbol = '🐳'
style = 'color_fg_env'
format = 'via[ $symbol( $context) ]($style)'

[conda]
disabled = false
symbol = '🅒'
style = 'color_fg_env'
format = 'via[ $symbol( $environment) ]($style)'

[pixi]
disabled = false
symbol = '🧚'
style = 'color_fg_env'
format = 'via[ $symbol $version ]($style)'

# ╭──────────────────────────────────────────────────────────╮
# │ 时间/耗时层                                              │
# ╰──────────────────────────────────────────────────────────╯
[time]
disabled = false
time_format = '%R'
style = 'color_fg_time'
format = '[  $time ]($style)'

[cmd_duration]
disabled = false
min_time = 500
show_milliseconds = true
style = 'color_fg_time'
format = '[ $duration]($style)'

# ╭──────────────────────────────────────────────────────────╮
# │ 提示符符号                                               │
# ╰──────────────────────────────────────────────────────────╯
[line_break]
disabled = false

[character]
success_symbol = '[](text bold)'
error_symbol   = '[](red bold)'

# ╭──────────────────────────────────────────────────────────╮
# │ 调色盘                                                   │
# ╰──────────────────────────────────────────────────────────╯
[palettes.color_collage] # https://www.design-seeds.com/2024/07/color-collage.html
color_fg_os   = '#79adcc'
color_fg_path = '#fbf2c4'
color_fg_git  = '#d25d52'
color_fg_lang = '#e3baaa'
color_fg_env  = '#e47e8c'
color_fg_time = '#ffaa6a'
